# Pushing the tag is the whole release: `git tag v0.1.0 && git push origin v0.1.0`
# builds, signs and publishes. Separate from ci.yml, which `lintel sync` overwrites.
#
# electron-builder makes the installers and electron-updater reads them back.
# Updates replace the whole bundle rather than patching it, which is the only
# strategy that works on all three platforms.
#
# ponytail: the guard job reruns `pnpm check` rather than polling ci.yml's run on
# the same commit, the way lintel's release.yml waits for its 11-minute e2e.
# Nothing here is that expensive, and the three build jobs are gated behind it
# anyway, so rerunning the cheap gate is less code than a cross-workflow poll.
#
# Secrets. A missing one degrades that platform to unsigned rather than failing:
#   MACOS_CERTIFICATE            base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD   password for that .p12
#   APPLE_ID, APPLE_TEAM_ID      notarization account
#   APPLE_APP_PASSWORD           app-specific password for notarytool
#   WINDOWS_CERTIFICATE          base64 of the code-signing .pfx
#   WINDOWS_CERTIFICATE_PASSWORD password for that .pfx
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_VERSION: 26.8.1

jobs:
  guard:
    name: refuse a release that is not ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The tag names the version. The updater compares releases against the
      # version baked into the app, so a tag that disagrees would ship a build
      # nobody can be offered.
      - name: Verify the app is at the version the tag names
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/syncVersion.ts
          BAKED="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$BAKED" ]; then
            echo "Tag $GITHUB_REF_NAME names $VERSION, but the app is built as $BAKED" >&2
            echo "Run: pnpm version:set $VERSION" >&2
            exit 1
          fi

      # Read before anything builds, because a release whose notes turn out to be
      # empty is one nobody can fix afterwards without editing it by hand.
      - name: Verify the changelog describes this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qxF "## $VERSION" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $VERSION' section." >&2
            echo "The release notes are written from it, so this would publish an empty release." >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # One job per platform, because an installer can only be made on the OS it
  # installs to: dmg needs hdiutil, NSIS needs Windows, AppImage needs Linux.
  package:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            certificate: MACOS_CERTIFICATE
            certificatePassword: MACOS_CERTIFICATE_PASSWORD
          - os: ubuntu-latest
          - os: windows-latest
            certificate: WINDOWS_CERTIFICATE
            certificatePassword: WINDOWS_CERTIFICATE_PASSWORD
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --publish never: the release is written once, by the job below, from
      # every platform's artifacts at the same time. electron-builder still
      # writes the latest*.yml the updater reads.
      - name: Build the installers
        env:
          CSC_LINK: ${{ secrets[matrix.certificate] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.certificatePassword] }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm desktop:pack

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.yml
            release/*.blockmap

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      # Writes the GitHub release on the tag that triggered this run.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The changelog section for this version. Generated notes still follow
      # underneath: they answer "which commits", this answers "what changed",
      # and the second is what someone arriving at the release came for.
      - name: Compose the release notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: artifacts/*
