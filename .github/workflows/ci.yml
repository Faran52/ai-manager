# The gate in front of every push, written by @linteljs/create. It runs exactly what `pnpm check`
# runs locally, so a green commit here means the same checks passed. Add a second workflow file
# beside this one for anything else; this one is replaced on every `lintel sync`.
name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
