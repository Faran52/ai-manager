allowBuilds:
  'esbuild': true
  'sharp': true
  'unrs-resolver': true

minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.3.8'
  - '@types/react-dom@19.2.5'
  - astro@7.2.6 || 7.2.7
  - eslint@10.9.1
  - lucide-react@1.34.0
  - '@linteljs/eslint-config@1.5.0'
  - '@linteljs/eslint-plugin@1.5.0'

peerDependencyRules:
  allowedVersions:
    'eslint-plugin-import>eslint': '10'
    'eslint-plugin-jsx-a11y>eslint': '10'
