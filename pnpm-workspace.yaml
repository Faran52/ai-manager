allowBuilds:
  'esbuild': true
  'sharp': true
  'unrs-resolver': true

# Refuse a version published less than two days ago, so a compromised or
# broken release has time to be caught before it reaches the lockfile.
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - '@linteljs/*'

peerDependencyRules:
  allowedVersions:
    'eslint-plugin-import>eslint': '10'
    'eslint-plugin-jsx-a11y>eslint': '10'
