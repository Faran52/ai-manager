allowBuilds:
  # Downloads the Electron binary the desktop shell runs on.
  'electron': true
  # Squirrel.Windows only. The Windows target is NSIS, which app-builder makes.
  'electron-winstaller': false
  'esbuild': true
  'sharp': true
  'unrs-resolver': true

# Refuse a version published less than two days ago, so a compromised or
# broken release has time to be caught before it reaches the lockfile.
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - '@linteljs/*'

peerDependencyRules:
  allowedVersions:
    'eslint-plugin-import>eslint': '10'
    'eslint-plugin-jsx-a11y>eslint': '10'
