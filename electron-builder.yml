# How the desktop app is packaged. `pnpm desktop:pack` builds one for this
# machine; release.yml builds all three.
#
# Only `dist` and the shell's own files ship. Every npm dependency is already
# inlined into `dist/server` by astro.config's `ssr.noExternal`, which is why
# electron-updater is the one runtime dependency left in package.json and the
# only node_modules tree this carries.
#
# Named one by one, because `scripts/*.ts` would sweep the specs in too. A
# module left off this list fails at launch, not at build: name anything
# desktopEntry.ts imports.
appId: com.faran52.ai-manager
productName: AI Manager
copyright: Copyright © 2026 Faran Ali

# The window says "AI Manager"; the files must not. A space in a filename is
# mangled twice and differently: electron-builder writes the update feed with
# it replaced by "-", GitHub stores the asset with it replaced by ".", so the
# URL the updater builds from the feed is one nobody uploaded. The package name
# has no space in it, so nothing is left to disagree about.
artifactName: ${name}-${version}-${arch}.${ext}

directories:
  output: release

files:
  - dist/**
  - scripts/desktopEntry.ts
  - scripts/desktopUpdate.ts
  - scripts/desktopServer.ts
  - scripts/desktopPreload.cjs

# Where electron-updater looks, and where release.yml uploads. The metadata
# files electron-builder writes beside the artifacts are what it reads.
publish:
  provider: github
  owner: Faran52
  repo: ai-manager

mac:
  category: public.app-category.developer-tools
  icon: public/icon-1024.png
  # Notarization refuses an unhardened bundle, and the entitlements below are
  # the minimum a JIT-compiling runtime needs under it.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Off until there is a Developer ID to notarize with. Asking for it without
  # one does not fail the build, it is skipped, which reads like it happened.
  # The app installs its own updates instead, see scripts/desktopUpdate.ts.
  notarize: false
  target:
    # The zip is not a second download: electron-updater cannot apply a dmg.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

dmg:
  # The drag-to-install window: the app on the left, Applications on the right.
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  icon: public/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  # A per-machine install that asks where, rather than a silent one-click.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  icon: public/icon-512.png
  category: Development
  target:
    - target: AppImage
      arch: [x64, arm64]
